[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-triage-agent"
version = "0.1.0"
description = "An explainable, read-only agent for classifying and prioritising GitHub issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charan Yeragera" }]
keywords = ["github", "issue-triage", "ai-agent", "open-source", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
issue-triage = "issue_triage_agent.cli:main"
issue-triage-mcp = "issue_triage_agent.mcp_server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
mcp = ["mcp[cli]>=2.0,<3"]
openai-agent = ["openai-agents>=0.6.0", "mcp>=2.0,<3"]
benchmark = ["datasets>=3.0.0"]
similarity-experiments = ["sentence-transformers>=3.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
