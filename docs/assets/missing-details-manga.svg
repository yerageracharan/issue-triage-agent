<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">Mini manga: the mystery of the missing bug report details</title>
<desc id="desc">Three manga panels show a vague bug report, Triage-kun asking for steps and version information, and a much clearer report ready for a developer to investigate.</desc>
<defs>
 <pattern id="dots2" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#111" opacity=".25"/></pattern>
 <style>
  .frame{fill:#fff;stroke:#111;stroke-width:4;stroke-linejoin:round}
  .line{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .bold{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:900;fill:#111}
  .jp{font-family:'Noto Sans JP','Yu Gothic',Meiryo,sans-serif;font-weight:900;fill:#111}
  .red{fill:#d62828}
 </style>
</defs>
<rect x="4" y="4" width="1112" height="332" rx="10" fill="#f5f1e9" stroke="#111" stroke-width="4"/>
<g transform="translate(14 14)">
 <rect width="350" height="310" class="frame"/>
 <text x="15" y="25" class="bold" font-size="13">CASE 001 / THE REPORT</text>
 <path d="M33 56 L315 56 L315 221 L33 221Z" fill="url(#dots2)" opacity=".4"/>
 <path d="M53 82 Q53 65 73 65 L274 65 Q296 65 296 86 L296 178 Q296 196 276 196 L73 196 Q53 196 53 177Z" fill="#fff" class="line"/>
 <path d="M84 195 L68 217 L110 196" fill="#fff" class="line"/>
 <text x="174" y="117" text-anchor="middle" class="bold" font-size="26">"IT BROKE."</text>
 <text x="174" y="147" text-anchor="middle" class="bold" font-size="13" fill="#d62828">no steps. no version. no clues.</text>
 <path d="M72 245 L89 228 L105 245 M245 245 L262 228 L278 245" class="line"/>
 <text x="175" y="278" text-anchor="middle" class="jp red" font-size="22">情報が足りない!</text>
 <text x="175" y="298" text-anchor="middle" class="bold" font-size="11">THE MYSTERY BEGINS...</text>
</g>
<g transform="translate(385 14)">
 <rect width="350" height="310" class="frame"/>
 <text x="15" y="25" class="bold" font-size="13">CASE 002 / THE INTERROGATION</text>
 <path d="M68 83 L53 48 L100 70 L123 49 L150 72 L182 48 L170 108" fill="#fff" class="line"/>
 <path d="M68 91 Q72 65 96 69 Q119 62 128 78 Q151 64 172 84 Q187 111 174 156 Q163 182 124 184 Q82 181 68 147Z" fill="#fff" class="line"/>
 <path d="M88 119 Q99 109 110 119 M137 119 Q148 109 159 119" class="line"/>
 <path d="M111 144 Q123 153 136 144" class="line"/>
 <path d="M188 72 Q218 40 305 63 L315 127 Q274 142 205 122Z" fill="#fff" class="line"/>
 <text x="252" y="83" text-anchor="middle" class="bold" font-size="13">WHICH VERSION?</text>
 <text x="252" y="103" text-anchor="middle" class="bold" font-size="13">STEPS TO REPRODUCE?</text>
 <text x="252" y="122" text-anchor="middle" class="bold" font-size="13">EXPECTED VS ACTUAL?</text>
 <path d="M30 211 L320 211" stroke="#111" stroke-width="2" stroke-dasharray="5 5"/>
 <text x="175" y="245" text-anchor="middle" class="jp red" font-size="23">証拠をください。</text>
 <text x="175" y="275" text-anchor="middle" class="bold" font-size="13">A LITTLE CONTEXT, PLEASE.</text>
</g>
<g transform="translate(756 14)">
 <rect width="350" height="310" class="frame"/>
 <text x="15" y="25" class="bold" font-size="13">CASE 003 / THE BREAKTHROUGH</text>
 <rect x="29" y="54" width="292" height="164" rx="8" fill="#fff" class="line"/>
 <path d="M51 85 L70 85 M51 118 L70 118 M51 151 L70 151 M51 184 L70 184" stroke="#d62828" stroke-width="6" stroke-linecap="round"/>
 <text x="83" y="90" class="bold" font-size="13">VERSION: 2.4.1</text>
 <text x="83" y="123" class="bold" font-size="13">STEPS: 1. Open export...</text>
 <text x="83" y="156" class="bold" font-size="13">EXPECTED: CSV downloads</text>
 <text x="83" y="189" class="bold" font-size="13">ACTUAL: App crashes</text>
 <path d="M70 251 Q122 215 180 245 Q223 265 275 233" fill="none" stroke="#d62828" stroke-width="4"/>
 <text x="175" y="278" text-anchor="middle" class="jp" font-size="22">これなら調査できる!</text>
 <text x="175" y="299" text-anchor="middle" class="bold" font-size="11">NOW WE CAN INVESTIGATE.</text>
</g>
</svg>