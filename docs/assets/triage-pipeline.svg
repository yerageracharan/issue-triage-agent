<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#142a45"/></linearGradient></defs><rect width="1440" height="580" rx="30" fill="url(#bg)"/><text x="70" y="82" fill="#f5f8ff" font-family="Arial" font-size="38" font-weight="700">WHAT HAPPENS AFTER YOU ASK FOR A TRIAGE?</text>
<g font-family="Arial" text-anchor="middle"><rect x="60" y="180" width="205" height="150" rx="18" fill="#102e4b" stroke="#3f91bc" stroke-width="2"/><text x="162" y="230" fill="#fff" font-size="22" font-weight="700">1. Fetch</text><text x="162" y="270" fill="#b3cbe2" font-size="17">Read issue data</text><text x="162" y="296" fill="#b3cbe2" font-size="17">from GitHub</text>
<rect x="300" y="180" width="205" height="150" rx="18" fill="#102e4b" stroke="#3f91bc" stroke-width="2"/><text x="402" y="230" fill="#fff" font-size="22" font-weight="700">2. Classify</text><text x="402" y="270" fill="#b3cbe2" font-size="17">Bug / feature /</text><text x="402" y="296" fill="#b3cbe2" font-size="17">docs / question</text>
<rect x="540" y="180" width="205" height="150" rx="18" fill="#102e4b" stroke="#3f91bc" stroke-width="2"/><text x="642" y="230" fill="#fff" font-size="22" font-weight="700">3. Prioritise</text><text x="642" y="270" fill="#b3cbe2" font-size="17">Suggest P0 to P3</text><text x="642" y="296" fill="#b3cbe2" font-size="17">with reasons</text>
<rect x="780" y="180" width="205" height="150" rx="18" fill="#102e4b" stroke="#3f91bc" stroke-width="2"/><text x="882" y="230" fill="#fff" font-size="22" font-weight="700">4. Check</text><text x="882" y="270" fill="#b3cbe2" font-size="17">Missing details &amp;</text><text x="882" y="296" fill="#b3cbe2" font-size="17">possible duplicates</text>
<rect x="1020" y="180" width="205" height="150" rx="18" fill="#102e4b" stroke="#3f91bc" stroke-width="2"/><text x="1122" y="230" fill="#fff" font-size="22" font-weight="700">5. Present</text><text x="1122" y="270" fill="#b3cbe2" font-size="17">Report findings</text><text x="1122" y="296" fill="#b3cbe2" font-size="17">to your assistant</text></g>
<g stroke="#5ac9e8" stroke-width="5" fill="none"><path d="M265 255 H295"/><path d="M505 255 H535"/><path d="M745 255 H775"/><path d="M985 255 H1015"/></g><g fill="#5ac9e8"><path d="M285 243 L300 255 L285 267Z"/><path d="M525 243 L540 255 L525 267Z"/><path d="M765 243 L780 255 L765 267Z"/><path d="M1005 243 L1020 255 L1005 267Z"/></g><rect x="255" y="410" width="930" height="90" rx="18" fill="#0d2136" stroke="#3f6385"/><text x="720" y="450" text-anchor="middle" fill="#72d1ed" font-family="Arial" font-size="23" font-weight="700">HUMAN MAINTAINER MAKES THE FINAL DECISION</text><text x="720" y="480" text-anchor="middle" fill="#a8bdd6" font-family="Arial" font-size="18">No comments • No labels applied • No issue closures • No assignments</text></svg>
