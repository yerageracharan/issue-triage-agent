<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172b46"/></linearGradient></defs><rect width="1440" height="760" rx="30" fill="url(#bg)"/><text x="70" y="88" fill="#f5f8ff" font-family="Arial" font-size="42" font-weight="700">THREE CONNECTION ROUTES</text><text x="70" y="130" fill="#a8bdd6" font-family="Arial" font-size="22">Pick the route that matches where your AI assistant runs.</text>
<rect x="65" y="205" width="405" height="455" rx="24" fill="#102943" stroke="#3373a5" stroke-width="2"/><text x="105" y="265" fill="#6ad2ef" font-family="Arial" font-size="28" font-weight="700">01 / CLAUDE DESKTOP</text><text x="105" y="315" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Local stdio</text><rect x="105" y="360" width="325" height="72" rx="14" fill="#081a2b" stroke="#447da5"/><text x="267" y="405" fill="#eaf5ff" font-family="Arial" font-size="20" text-anchor="middle">Claude Desktop app</text><path d="M267 432 V472" stroke="#54c6e7" stroke-width="4"/><path d="M254 459 L267 474 L280 459" stroke="#54c6e7" stroke-width="4" fill="none"/><rect x="105" y="480" width="325" height="72" rx="14" fill="#081a2b" stroke="#447da5"/><text x="267" y="525" fill="#eaf5ff" font-family="Arial" font-size="20" text-anchor="middle">Python MCP process</text><text x="105" y="600" fill="#a8bdd6" font-family="Arial" font-size="18">Best for: personal computer, no hosting.</text>
<rect x="518" y="205" width="405" height="455" rx="24" fill="#102943" stroke="#3373a5" stroke-width="2"/><text x="558" y="265" fill="#6ad2ef" font-family="Arial" font-size="28" font-weight="700">02 / CHATGPT</text><text x="558" y="315" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Remote HTTPS</text><rect x="558" y="360" width="325" height="72" rx="14" fill="#081a2b" stroke="#447da5"/><text x="720" y="405" fill="#eaf5ff" font-family="Arial" font-size="20" text-anchor="middle">ChatGPT custom MCP app</text><path d="M720 432 V472" stroke="#54c6e7" stroke-width="4"/><path d="M707 459 L720 474 L733 459" stroke="#54c6e7" stroke-width="4" fill="none"/><rect x="558" y="480" width="325" height="72" rx="14" fill="#081a2b" stroke="#447da5"/><text x="720" y="525" fill="#eaf5ff" font-family="Arial" font-size="20" text-anchor="middle">HTTPS MCP endpoint</text><text x="558" y="600" fill="#a8bdd6" font-family="Arial" font-size="18">Needs reachable endpoint / secure tunnel.</text>
<rect x="970" y="205" width="405" height="455" rx="24" fill="#102943" stroke="#3373a5" stroke-width="2"/><text x="1010" y="265" fill="#6ad2ef" font-family="Arial" font-size="28" font-weight="700">03 / LOCAL AGENT</text><text x="1010" y="315" fill="#fff" font-family="Arial" font-size="23" font-weight="700">CLI / Python client</text><rect x="1010" y="360" width="325" height="72" rx="14" fill="#081a2b" stroke="#447da5"/><text x="1172" y="405" fill="#eaf5ff" font-family="Arial" font-size="20" text-anchor="middle">Your Python / IDE agent</text><path d="M1172 432 V472" stroke="#54c6e7" stroke-width="4"/><path d="M1159 459 L1172 474 L1185 459" stroke="#54c6e7" stroke-width="4" fill="none"/><rect x="1010" y="480" width="325" height="72" rx="14" fill="#081a2b" stroke="#447da5"/><text x="1172" y="525" fill="#eaf5ff" font-family="Arial" font-size="20" text-anchor="middle">MCP / CLI interface</text><text x="1010" y="600" fill="#a8bdd6" font-family="Arial" font-size="18">Best for: custom automations and experiments.</text>
<text x="720" y="715" fill="#9fb4ce" font-family="Arial" font-size="17" text-anchor="middle">MCP is the shared tool language; each host decides how it connects.</text></svg>
