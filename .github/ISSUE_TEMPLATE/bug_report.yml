name: Bug report
description: Report a reproducible issue-triage defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic issue payloads. Never include GitHub tokens, private issue content, or confidential repository information."
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal issue payload, labels, command, and expected result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected classification and rationale
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and evidence
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA / version
  - type: input
    id: python
    attributes:
      label: Python version and operating system
