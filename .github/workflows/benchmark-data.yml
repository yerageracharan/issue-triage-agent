name: Prepare duplicate-detection benchmark

run-name: IssueDupesLite benchmark preparation

on:
  push:
    branches: [main]
    paths:
      - "evaluation/benchmark/**"
      - ".github/workflows/benchmark-data.yml"
      - "tests/test_benchmark.py"
      - "tests/test_baseline_evaluation.py"
      - "tests/test_similarity_experiments.py"
      - "tests/test_error_analysis.py"
      - "tests/test_frozen_hybrid.py"
      - "evaluation/frozen_hybrid.py"
      - "evaluation/frozen_hybrid_config.json"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Deterministic sampling seed"
        required: true
        default: "42"
        type: string
      negative_ratio:
        description: "Weak negatives per positive pair"
        required: true
        default: "1.0"
        type: string
      hard_negative_fraction:
        description: "Fraction of negatives sampled as lexical hard negatives"
        required: true
        default: "0.5"
        type: string

permissions:
  contents: read

concurrency:
  group: issuedupeslite-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-and-validate:
    name: Download, prepare, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BENCHMARK_SEED: ${{ github.event.inputs.seed || '42' }}
      NEGATIVE_RATIO: ${{ github.event.inputs.negative_ratio || '1.0' }}
      HARD_NEGATIVE_FRACTION: ${{ github.event.inputs.hard_negative_fraction || '0.5' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install benchmark, test, and similarity experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[benchmark,test,similarity-experiments]"

      - name: Test benchmark preparation and baseline evaluation logic
        run: python -m pytest tests/test_benchmark.py tests/test_baseline_evaluation.py tests/test_similarity_experiments.py tests/test_error_analysis.py tests/test_frozen_hybrid.py

      - name: Download IssueDupesLite and prepare repository-level splits
        run: |
          python -m evaluation.benchmark.prepare_benchmark \
            --dataset-id primordic/IssueDupesLite \
            --seed "$BENCHMARK_SEED" \
            --negative-ratio "$NEGATIVE_RATIO" \
            --hard-negative-fraction "$HARD_NEGATIVE_FRACTION" \
            --train-ratio 0.70 \
            --validation-ratio 0.15 \
            --test-ratio 0.15 \
            --output-dir evaluation/benchmark/generated \
            --cache-dir evaluation/benchmark/.cache

      - name: Validate benchmark files and repository isolation
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import sys
          from pathlib import Path

          csv.field_size_limit(sys.maxsize)

          root = Path("evaluation/benchmark/generated")
          required = [
              "positive_pairs.csv",
              "negative_pairs.csv",
              "repository_splits.csv",
              "train.csv",
              "validation.csv",
              "test.csv",
              "manifest.json",
              "ATTRIBUTION.md",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing benchmark outputs: {missing}")

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("repository_split_leakage_free") is not True:
              raise SystemExit("Manifest does not confirm repository-level split isolation.")
          if not manifest.get("dataset_revision") or manifest["dataset_revision"] == "main":
              raise SystemExit("Dataset revision was not pinned to a commit SHA.")
          if not manifest.get("positive_pairs"):
              raise SystemExit("No positive pairs were generated.")

          with (root / "repository_splits.csv").open(encoding="utf-8-sig", newline="") as handle:
              repo_split = {row["repo"].casefold(): row["split"] for row in csv.DictReader(handle)}
          if not repo_split:
              raise SystemExit("No repository split assignments were generated.")

          seen_pairs = set()
          totals = {}
          for split in ("train", "validation", "test"):
              path = root / f"{split}.csv"
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              if not rows:
                  raise SystemExit(f"{split}.csv is empty; inspect dataset distribution.")
              positives = sum(int(row["pair_label"]) == 1 for row in rows)
              negatives = sum(int(row["pair_label"]) == 0 for row in rows)
              for row in rows:
                  repository = row["repo"].casefold()
                  pair_id = row["pair_id"]
                  if repo_split.get(repository) != split:
                      raise SystemExit(f"Repository leakage detected: {repository} appears in {split}.")
                  if pair_id in seen_pairs:
                      raise SystemExit(f"Pair appears in more than one split: {pair_id}")
                  seen_pairs.add(pair_id)
                  label = int(row["pair_label"])
                  if label == 0 and row["label_quality"] != "weak_unlinked_candidate_not_human_verified":
                      raise SystemExit(f"Negative pair lacks weak-label warning: {pair_id}")
                  if label not in (0, 1):
                      raise SystemExit(f"Unexpected pair label {label} for {pair_id}")
              totals[split] = {
                  "pairs": len(rows),
                  "positive_pairs": positives,
                  "weak_negative_pairs": negatives,
                  "repositories": len({row["repo"].casefold() for row in rows}),
              }

          expected_total = manifest["positive_pairs"] + manifest["negative_pairs"]
          if len(seen_pairs) != expected_total:
              raise SystemExit(
                  f"Split total {len(seen_pairs)} does not match manifest total {expected_total}."
              )
          if not any(item["weak_negative_pairs"] for item in totals.values()):
              raise SystemExit("No weak negative pairs were generated.")

          print(json.dumps({
              "dataset_revision": manifest["dataset_revision"],
              "source_rows": manifest["input_rows"],
              "positive_pairs": manifest["positive_pairs"],
              "weak_negative_pairs": manifest["negative_pairs"],
              "repositories": manifest["repositories"],
              "repository_split_leakage_free": manifest["repository_split_leakage_free"],
              "splits": totals,
          }, indent=2))

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("# IssueDupesLite benchmark prepared\n\n")
              handle.write(f"- Dataset revision: {manifest['dataset_revision']}\n")
              handle.write(f"- Source rows: **{manifest['input_rows']}**\n")
              handle.write(f"- Positive pairs: **{manifest['positive_pairs']}**\n")
              handle.write(f"- Weak/unverified negatives: **{manifest['negative_pairs']}**\n")
              handle.write(f"- Repositories: **{manifest['repositories']}**\n")
              handle.write("- Repository-level leakage check: **passed**\n\n")
              handle.write("| Split | Pairs | Positives | Weak negatives | Repositories |\n")
              handle.write("|---|---:|---:|---:|---:|\n")
              for name, counts in totals.items():
                  handle.write(
                      f"| {name} | {counts['pairs']} | {counts['positive_pairs']} "
                      f"| {counts['weak_negative_pairs']} | {counts['repositories']} |\n"
                  )
              handle.write(
                  "\nCaution: negatives are unlinked candidates, not human-confirmed non-duplicates.\n"
              )
          PY

      - name: Run unchanged duplicate-detector baseline on held-out test split
        run: python -m evaluation.benchmark.evaluate_baseline --test-csv evaluation/benchmark/generated/test.csv --manifest evaluation/benchmark/generated/manifest.json --output-dir evaluation/benchmark/generated/baseline

      - name: Compare lexical, BM25, semantic, and hybrid methods on validation split
        run: python -m evaluation.benchmark.evaluate_similarity_methods --train-csv evaluation/benchmark/generated/train.csv --validation-csv evaluation/benchmark/generated/validation.csv --model sentence-transformers/all-MiniLM-L6-v2 --output-dir evaluation/benchmark/generated/phase3

      - name: Run Phase 4 validation error analysis and prepare human review pack
        run: python -m evaluation.benchmark.analyze_similarity_errors --validation-csv evaluation/benchmark/generated/validation.csv --scores-csv evaluation/benchmark/generated/phase3/similarity_scores.csv --comparison-json evaluation/benchmark/generated/phase3/similarity_comparison.json --output-dir evaluation/benchmark/generated/phase4 --top-n 10

      - name: Run frozen hybrid evaluation on held-out test split
        run: python -m evaluation.frozen_hybrid --train-csv evaluation/benchmark/generated/train.csv --test-csv evaluation/benchmark/generated/test.csv --manifest evaluation/benchmark/generated/manifest.json --config evaluation/frozen_hybrid_config.json --model sentence-transformers/all-MiniLM-L6-v2 --output-dir evaluation/benchmark/generated/phase6

      - name: Upload benchmark, baseline, Phase 3 comparison, and Phase 4 review pack
        uses: actions/upload-artifact@v4
        with:
          name: issuedupeslite-benchmark-${{ github.run_number }}
          path: evaluation/benchmark/generated/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
