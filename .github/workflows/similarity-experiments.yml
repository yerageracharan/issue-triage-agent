name: Phase 3 similarity experiments

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare-methods:
    name: Compare lexical, BM25, semantic, and hybrid methods
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ runner.temp }}/hf-cache
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install project and experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[benchmark,test,similarity-experiments]"

      - name: Test benchmark and experiment code
        run: python -m pytest tests/test_benchmark.py tests/test_baseline_evaluation.py tests/test_similarity_experiments.py

      - name: Prepare the pinned IssueDupesLite dataset
        run: |
          python -m evaluation.benchmark.prepare_benchmark \
            --dataset-id primordic/IssueDupesLite \
            --revision 902b5805afa93e8cb018bd3c860c0f3eba55029e \
            --seed 42 \
            --negative-ratio 1.0 \
            --hard-negative-fraction 0.5 \
            --train-ratio 0.70 \
            --validation-ratio 0.15 \
            --test-ratio 0.15 \
            --output-dir evaluation/benchmark/generated \
            --cache-dir evaluation/benchmark/.cache

      - name: Compare methods on train and validation splits
        run: |
          python -m evaluation.benchmark.evaluate_similarity_methods \
            --train-csv evaluation/benchmark/generated/train.csv \
            --validation-csv evaluation/benchmark/generated/validation.csv \
            --model sentence-transformers/all-MiniLM-L6-v2 \
            --output-dir evaluation/benchmark/generated/phase3

      - name: Upload Phase 3 comparison
        uses: actions/upload-artifact@v4
        with:
          name: issue-triage-phase3-comparison-${{ github.run_number }}
          path: evaluation/benchmark/generated/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
